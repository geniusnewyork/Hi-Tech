  <text x="250" y="315" font-family="'Inter', sans-serif" font-weight="900" font-size="26" fill="#FFFFFF" text-anchor="middle">HI-TECH Mobile</text>
  <text x="250" y="348" font-family="'Inter', sans-serif" font-weight="600" font-size="16" fill="#A1A1AA" text-anchor="middle">@hitechmobile-i4e</text>
  <text x="250" y="380" font-family="'Inter', sans-serif" font-weight="500" font-size="13" fill="#FFD400" text-anchor="middle">Mobile Reviews • Comparisons • Tech Guides</text>

