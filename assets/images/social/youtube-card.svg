      <stop offset="0%" stop-color="#FF0000" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="500" height="500" rx="36" fill="#121214" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
