<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Glow Gradient -->
    <radialGradient id="heroBackGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFD400" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#FF9900" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Gold Edge Gradients -->
    <linearGradient id="goldChassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7" />
      <stop offset="25%" stop-color="#FFD400" />
      <stop offset="50%" stop-color="#D49B00" />
      <stop offset="75%" stop-color="#FFDF6D" />
      <stop offset="100%" stop-color="#996E00" />
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C1017" />
      <stop offset="40%" stop-color="#050505" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>

    <!-- Glowing circuit accents -->
    <linearGradient id="cyanLine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>

    <!-- Device Shadow -->
    <filter id="phoneShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#FFD400" flood-opacity="0.12" />
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <clipPath id="screenClip">
      <rect x="156" y="76" width="288" height="548" rx="36" />
    </clipPath>
  </defs>

  <!-- Ambient Glow Behind Device -->
  <circle cx="300" cy="350" r="280" fill="url(#heroBackGlow)" />

  <!-- Floating Tech Orbits -->
  <circle cx="300" cy="350" r="260" stroke="#FFD400" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="8 12" />
  <circle cx="300" cy="350" r="220" stroke="#00D4FF" stroke-opacity="0.10" stroke-width="1" stroke-dasharray="4 8" />

  <!-- Smartphone Assembly -->
  <g filter="url(#phoneShadow)">
    <!-- Outer Titanium Chassis with Gold Bezel Accent -->
    <rect x="150" y="70" width="300" height="560" rx="42" fill="#1C1C1E" stroke="url(#goldChassis)" stroke-width="4.5" />
    
    <!-- Inner Screen Bezel -->
    <rect x="154" y="74" width="292" height="552" rx="38" fill="#0A0A0A" />

    <!-- Screen Glass & Display Contents -->
    <g clip-path="url(#screenClip)">
      <!-- Wallpaper background -->
      <rect x="156" y="76" width="288" height="548" fill="url(#screenGrad)" />

      <!-- Abstract Graphic Wallpaper inside Display -->
      <circle cx="320" cy="240" r="140" fill="#FFD400" fill-opacity="0.08" />
      <circle cx="260" cy="380" r="120" fill="#00D4FF" fill-opacity="0.06" />

      <!-- Diagonal light reflection sweep across glass -->
      <polygon points="156,76 250,76 444,480 350,480" fill="#FFFFFF" fill-opacity="0.025" />

      <!-- Top Status Bar -->
      <text x="180" y="104" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="12" fill="#FFFFFF">10:24</text>
      <!-- 5G, Wi-Fi & Battery Icons -->
      <text x="385" y="104" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="10" fill="#FFD400">5G</text>
      <path d="M404 98 A 5 5 0 0 1 414 98 M406 101 A 3 3 0 0 1 412 101 M409 104 A 1 1 0 0 1 409 104" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <rect x="420" y="94" width="16" height="9" rx="2.5" stroke="#FFFFFF" stroke-width="1.2" fill="none" />
      <rect x="422" y="96" width="10" height="5" rx="1.5" fill="#FFD400" />

      <!-- Dynamic Island / Pill Camera -->
      <rect x="250" y="86" width="100" height="24" rx="12" fill="#000000" stroke="#222222" stroke-width="0.8" />
      <circle cx="330" cy="98" r="4.5" fill="#0D1117" stroke="#1F2937" stroke-width="1" />
      <circle cx="331" cy="97" r="1.5" fill="#00D4FF" opacity="0.8" />

      <!-- Screen Widget: HI-TECH Welcome Card -->
      <rect x="176" y="140" width="248" height="135" rx="18" fill="#141416" fill-opacity="0.9" stroke="rgba(255,212,0,0.25)" stroke-width="1.2" />
      <circle cx="204" cy="172" r="16" fill="#FFD400" fill-opacity="0.15" />
      <!-- Logo in widget -->
      <text x="198" y="177" font-family="'Inter', sans-serif" font-weight="900" font-size="14" fill="#FFD400">H</text>
      <text x="230" y="168" font-family="'Inter', sans-serif" font-weight="800" font-size="14" fill="#FFFFFF">HI-TECH</text>
      <text x="230" y="184" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#FFD400">MOBILE HUB • HANSI</text>
      
      <text x="196" y="218" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#FFFFFF">Smartphones &amp; Care</text>
      <text x="196" y="236" font-family="'Inter', sans-serif" font-weight="400" font-size="10" fill="#9CA3AF">All Top Brands • Express Service</text>
      <rect x="196" y="248" width="80" height="16" rx="8" fill="#FFD400" />
      <text x="206" y="259" font-family="'Inter', sans-serif" font-weight="800" font-size="8" fill="#000000">100% GENUINE</text>

      <!-- App Grid Icons in Screen -->
      <g transform="translate(182, 300)">
        <!-- App 1: Phones -->
        <rect x="0" y="0" width="46" height="46" rx="12" fill="#1F242D" stroke="rgba(255,212,0,0.3)" />
        <rect x="16" y="10" width="14" height="26" rx="3" fill="#FFD400" />
        <text x="23" y="58" font-family="'Inter', sans-serif" font-size="8.5" fill="#E5E5E5" text-anchor="middle">Mobiles</text>

        <!-- App 2: Accessories -->
        <rect x="64" y="0" width="46" height="46" rx="12" fill="#1F242D" stroke="rgba(255,255,255,0.1)" />
        <circle cx="87" cy="20" r="8" stroke="#00D4FF" stroke-width="2.5" fill="none" />
        <line x1="87" y1="28" x2="87" y2="35" stroke="#00D4FF" stroke-width="2" />
        <text x="87" y="58" font-family="'Inter', sans-serif" font-size="8.5" fill="#E5E5E5" text-anchor="middle">Accessories</text>

        <!-- App 3: Repair -->
        <rect x="128" y="0" width="46" height="46" rx="12" fill="#1F242D" stroke="rgba(255,255,255,0.1)" />
        <path d="M144 18 L158 32 M156 18 L142 32" stroke="#FFD400" stroke-width="2.5" stroke-linecap="round" />
        <text x="151" y="58" font-family="'Inter', sans-serif" font-size="8.5" fill="#E5E5E5" text-anchor="middle">Repairs</text>

        <!-- App 4: Exchange -->
        <rect x="192" y="0" width="46" height="46" rx="12" fill="#1F242D" stroke="rgba(255,255,255,0.1)" />
        <path d="M208 18 L222 18 L218 14 M222 28 L208 28 L212 32" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="215" y="58" font-family="'Inter', sans-serif" font-size="8.5" fill="#E5E5E5" text-anchor="middle">Exchange</text>
      </g>

      <!-- Shop Location card at screen bottom -->
      <rect x="176" y="400" width="248" height="96" rx="16" fill="#121214" stroke="rgba(255,255,255,0.12)" />
      <circle cx="204" cy="428" r="14" fill="#00D4FF" fill-opacity="0.12" />
      <path d="M204 420 C200 420 197 423 197 427 C197 433 204 439 204 439 C204 439 211 433 211 427 C211 423 208 420 204 420 Z" fill="#00D4FF" />
      <circle cx="204" cy="426" r="2.5" fill="#0A0A0A" />
      <text x="228" y="425" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF">Shop in Hansi, HR</text>
      <text x="228" y="441" font-family="'Inter', sans-serif" font-weight="500" font-size="10" fill="#9CA3AF">WhatsApp: 86077 77717</text>
      <rect x="196" y="458" width="208" height="26" rx="6" fill="#25D366" />
      <text x="300" y="475" font-family="'Inter', sans-serif" font-weight="800" font-size="10.5" fill="#FFFFFF" text-anchor="middle">Direct WhatsApp Chat ➜</text>

      <!-- Bottom Home Swipe Bar -->
      <rect x="250" y="605" width="100" height="4" rx="2" fill="#888888" />
    </g>

    <!-- Side Button cutouts on Chassis -->
    <!-- Volume rocker left -->
    <rect x="146" y="160" width="4" height="42" rx="2" fill="#D49B00" />
    <rect x="146" y="215" width="4" height="42" rx="2" fill="#D49B00" />
    <!-- Power Button right -->
    <rect x="450" y="180" width="4" height="58" rx="2" fill="#D49B00" />
  </g>

  <!-- Floating Feature Badges around the device -->
  <!-- Floating Badge 1: 100% Genuine Brands (Top Left) -->
  <g filter="url(#badgeShadow)" transform="translate(30, 160)">
    <rect x="0" y="0" width="180" height="64" rx="14" fill="#141416" stroke="url(#goldChassis)" stroke-width="1.8" />
    <circle cx="32" cy="32" r="18" fill="#FFD400" fill-opacity="0.2" />
    <path d="M25 32 L30 37 L39 26" stroke="#FFD400" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="58" y="27" font-family="'Inter', sans-serif" font-weight="800" font-size="12" fill="#FFFFFF">Original Devices</text>
    <text x="58" y="44" font-family="'Inter', sans-serif" font-weight="500" font-size="10" fill="#FFD400">Apple • Samsung &amp; More</text>
  </g>

  <!-- Floating Badge 2: Quick Repair Service (Bottom Right) -->
  <g filter="url(#badgeShadow)" transform="translate(380, 480)">
    <rect x="0" y="0" width="190" height="68" rx="14" fill="#141416" stroke="#00D4FF" stroke-width="1.8" />
    <circle cx="34" cy="34" r="18" fill="#00D4FF" fill-opacity="0.2" />
    <!-- Wrench icon -->
    <path d="M28 40 L34 34 M34 34 L38 30 C40 28 40 25 38 23 C36 21 33 21 31 23 L27 27 M34 34 L26 42" stroke="#00D4FF" stroke-width="2.5" stroke-linecap="round" />
    <text x="60" y="29" font-family="'Inter', sans-serif" font-weight="800" font-size="12" fill="#FFFFFF">Express Repair</text>
    <text x="60" y="46" font-family="'Inter', sans-serif" font-weight="500" font-size="10" fill="#00D4FF">Screen • Battery • Charging</text>
  </g>

  <!-- Floating Badge 3: WhatsApp Instant Support (Bottom Left) -->
  <g filter="url(#badgeShadow)" transform="translate(40, 490)">
    <rect x="0" y="0" width="170" height="60" rx="14" fill="#0F1F15" stroke="#25D366" stroke-width="1.8" />
    <circle cx="30" cy="30" r="16" fill="#25D366" fill-opacity="0.2" />
    <path d="M23 35 L25 30 C23 27 24 23 27 21 C31 18 36 20 37 24 C38 28 35 32 31 32 C30 32 29 32 28 33 L23 35 Z" fill="#25D366" />
    <text x="54" y="27" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#FFFFFF">Instant WhatsApp</text>
    <text x="54" y="43" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#25D366">+91 86077 77717</text>
  </g>
</svg>
