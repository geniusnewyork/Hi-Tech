<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="miBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2330" />
      <stop offset="100%" stop-color="#0E121B" />
    </linearGradient>
    <linearGradient id="miGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD400" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
  </defs>
  <rect x="74" y="40" width="172" height="320" rx="28" fill="url(#miBody)" stroke="url(#miGold)" stroke-width="2.5" />
  
  <!-- Xiaomi / Redmi Deco Island -->
  <rect x="86" y="55" width="80" height="96" rx="16" fill="#151A24" stroke="rgba(255,255,255,0.15)" stroke-width="1.2" />
  <!-- Giant 200MP Lens Ring -->
  <circle cx="126" cy="88" r="22" fill="#090C11" stroke="url(#miGold)" stroke-width="2.5" />
  <circle cx="126" cy="88" r="9" fill="#1E293B" />
  <circle cx="124" cy="86" r="3" fill="#00D4FF" />
  <text x="126" y="117" font-family="'Inter', sans-serif" font-weight="800" font-size="7" fill="#FFD400" text-anchor="middle">200MP OIS</text>

  <!-- Secondary lenses -->
  <circle cx="106" cy="132" r="7" fill="#090C11" stroke="#334155" stroke-width="1.2" />
  <circle cx="146" cy="132" r="7" fill="#090C11" stroke="#334155" stroke-width="1.2" />

  <text x="160" y="240" font-family="'Inter', sans-serif" font-weight="900" font-size="16" fill="#F97316" letter-spacing="1" text-anchor="middle">Redmi / Xiaomi</text>

  <rect x="95" y="295" width="130" height="26" rx="13" fill="#111827" stroke="rgba(255,212,0,0.3)" />
  <text x="160" y="312" font-family="'Inter', sans-serif" font-weight="700" font-size="10.5" fill="#FFD400" text-anchor="middle">SuperNote 5G</text>
</svg>
