<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="oppoBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2822" />
      <stop offset="100%" stop-color="#0F1713" />
    </linearGradient>
    <linearGradient id="oppoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD400" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>
  <rect x="74" y="40" width="172" height="320" rx="30" fill="url(#oppoBody)" stroke="url(#oppoGold)" stroke-width="2.5" />
  
  <!-- Pill shaped Camera Matrix (Oppo Reno style) -->
  <rect x="88" y="55" width="70" height="115" rx="35" fill="#141E18" stroke="#374151" stroke-width="1.5" />
  <circle cx="123" cy="88" r="15" fill="#090E0B" stroke="url(#oppoGold)" stroke-width="2" />
  <circle cx="123" cy="88" r="6" fill="#10B981" />
  <circle cx="123" cy="132" r="11" fill="#090E0B" stroke="#374151" stroke-width="1.5" />
  <circle cx="123" cy="132" r="4" fill="#00D4FF" />

  <text x="160" y="240" font-family="'Inter', sans-serif" font-weight="900" font-size="16" fill="#10B981" letter-spacing="4" text-anchor="middle">OPPO</text>
  <text x="160" y="260" font-family="'Inter', sans-serif" font-weight="600" font-size="10.5" fill="#A3A3A3" text-anchor="middle">Reno Innovation</text>

  <rect x="95" y="295" width="130" height="26" rx="13" fill="#111827" stroke="rgba(255,212,0,0.3)" />
  <text x="160" y="312" font-family="'Inter', sans-serif" font-weight="700" font-size="10.5" fill="#FFD400" text-anchor="middle">Ultra-Clear Imaging</text>
</svg>
