<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="samBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E232A" />
      <stop offset="50%" stop-color="#14171C" />
      <stop offset="100%" stop-color="#0E1014" />
    </linearGradient>
    <linearGradient id="samGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD400" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  <!-- Background Glow -->
  <circle cx="160" cy="200" r="140" fill="#00D4FF" fill-opacity="0.05" />

  <!-- Device Plate (Boxier Ultra Look) -->
  <rect x="75" y="40" width="170" height="320" rx="16" fill="url(#samBody)" stroke="url(#samGold)" stroke-width="2.5" />
  
  <!-- Vertical Floating Camera Rings (Samsung signature) -->
  <circle cx="106" cy="74" r="13" fill="#0A0C10" stroke="url(#samGold)" stroke-width="2.5" />
  <circle cx="106" cy="74" r="6" fill="#1E293B" />
  <circle cx="104" cy="72" r="2" fill="#00D4FF" />

  <circle cx="106" cy="114" r="13" fill="#0A0C10" stroke="url(#samGold)" stroke-width="2.5" />
  <circle cx="106" cy="114" r="6" fill="#1E293B" />
  <circle cx="104" cy="112" r="2" fill="#00D4FF" />

  <circle cx="106" cy="154" r="13" fill="#0A0C10" stroke="url(#samGold)" stroke-width="2.5" />
  <circle cx="106" cy="154" r="6" fill="#1E293B" />
  <circle cx="104" cy="152" r="2" fill="#00D4FF" />

  <!-- Secondary Sensors Column -->
  <circle cx="138" cy="86" r="6" fill="#FFEAA7" />
  <circle cx="138" cy="114" r="9" fill="#0A0C10" stroke="#374151" stroke-width="1.8" />
  <circle cx="138" cy="114" r="4" fill="#0F172A" />

  <!-- Samsung Logo Typography in Gold -->
  <text x="160" y="240" font-family="'Inter', sans-serif" font-weight="800" font-size="13" fill="#FFFFFF" letter-spacing="4" text-anchor="middle">SAMSUNG</text>

  <!-- Model Badge -->
  <rect x="95" y="295" width="130" height="26" rx="13" fill="#111827" stroke="rgba(255,212,0,0.3)" />
  <text x="160" y="312" font-family="'Inter', sans-serif" font-weight="700" font-size="10.5" fill="#FFD400" text-anchor="middle">Galaxy 5G Flagship</text>
</svg>
