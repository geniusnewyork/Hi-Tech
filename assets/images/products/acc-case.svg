<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="caseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD400" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="caseMat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272A" />
      <stop offset="50%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
  </defs>
  <circle cx="160" cy="160" r="140" fill="url(#caseGlow)" />
  <!-- Shockproof Bumper Armor Cover -->
  <rect x="100" y="55" width="120" height="200" rx="26" fill="url(#caseMat)" stroke="#FFD400" stroke-width="2.5" />
  
  <!-- Corner Air Cushion Bumpers -->
  <rect x="96" y="52" width="18" height="18" rx="6" fill="#3F3F46" stroke="#FFD400" stroke-width="1.5" />
  <rect x="206" y="52" width="18" height="18" rx="6" fill="#3F3F46" stroke="#FFD400" stroke-width="1.5" />
  <rect x="96" y="238" width="18" height="18" rx="6" fill="#3F3F46" stroke="#FFD400" stroke-width="1.5" />
  <rect x="206" y="238" width="18" height="18" rx="6" fill="#3F3F46" stroke="#FFD400" stroke-width="1.5" />

  <!-- Camera Cutout Raised Lip -->
  <rect x="115" y="70" width="50" height="50" rx="14" fill="#09090B" stroke="#00D4FF" stroke-width="2" />

  <!-- Magnetic Ring (MagSafe / Grip) -->
  <circle cx="160" cy="160" r="30" stroke="#FFD400" stroke-width="3" stroke-dasharray="10 4" fill="none" />
  <circle cx="160" cy="160" r="12" fill="#27272A" stroke="rgba(255,255,255,0.2)" stroke-width="1" />

  <text x="160" y="278" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">Premium Mobile Covers &amp; Cases</text>
  <text x="160" y="295" font-family="'Inter', sans-serif" font-weight="500" font-size="10" fill="#FFD400" text-anchor="middle">MagSafe, Matte, Silicone &amp; Armor</text>
</svg>
