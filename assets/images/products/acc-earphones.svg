<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="epGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD400" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle cx="160" cy="160" r="140" fill="url(#epGlow)" />
  <!-- Wired / Neckband Earphones SVG -->
  <!-- Neckband Arch -->
  <path d="M90 170 C90 90 230 90 230 170" stroke="#27272A" stroke-width="12" stroke-linecap="round" />
  <path d="M90 170 C90 90 230 90 230 170" stroke="#FFD400" stroke-width="2" stroke-linecap="round" />

  <!-- Magnetic Pods & Cables -->
  <rect x="80" y="150" width="18" height="40" rx="6" fill="#18181B" stroke="#FFD400" stroke-width="1.5" />
  <rect x="222" y="150" width="18" height="40" rx="6" fill="#18181B" stroke="#FFD400" stroke-width="1.5" />

  <!-- Earbud Tips -->
  <circle cx="135" cy="190" r="12" fill="#18181B" stroke="#FFD400" stroke-width="1.5" />
  <circle cx="135" cy="190" r="4" fill="#00D4FF" />
  
  <circle cx="185" cy="190" r="12" fill="#18181B" stroke="#FFD400" stroke-width="1.5" />
  <circle cx="185" cy="190" r="4" fill="#00D4FF" />

  <!-- Magnetic snap line -->
  <line x1="147" y1="190" x2="173" y2="190" stroke="#FFD400" stroke-width="1.5" stroke-dasharray="2 2" />

  <text x="160" y="278" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">Neckbands &amp; Wired Earphones</text>
  <text x="160" y="295" font-family="'Inter', sans-serif" font-weight="500" font-size="10" fill="#FFD400" text-anchor="middle">Heavy Bass • In-line Mic • Type-C &amp; 3.5mm</text>
</svg>
