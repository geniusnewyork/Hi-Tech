<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="watchGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD400" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="watchGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7" />
      <stop offset="50%" stop-color="#FFD400" />
      <stop offset="100%" stop-color="#B48200" />
    </linearGradient>
  </defs>
  <circle cx="160" cy="160" r="140" fill="url(#watchGlow)" />
  <!-- Watch Straps Top & Bottom -->
  <rect x="135" y="30" width="50" height="70" rx="10" fill="#18181B" stroke="#27272A" stroke-width="1.5" />
  <rect x="135" y="190" width="50" height="70" rx="10" fill="#18181B" stroke="#27272A" stroke-width="1.5" />
  
  <!-- Watch Case Chassis -->
  <rect x="110" y="80" width="100" height="116" rx="28" fill="#1F2128" stroke="url(#watchGold)" stroke-width="3" />
  <!-- Screen Glass -->
  <rect x="118" y="88" width="84" height="100" rx="22" fill="#090A0D" />

  <!-- Crown button -->
  <rect x="210" y="108" width="6" height="24" rx="3" fill="#FFD400" />

  <!-- Display info -->
  <text x="160" y="128" font-family="'Inter', sans-serif" font-weight="800" font-size="16" fill="#FFFFFF" text-anchor="middle">10:24</text>
  <circle cx="160" cy="154" r="14" stroke="#FFD400" stroke-width="2.5" fill="none" stroke-dasharray="18 6" />
  <text x="160" y="157" font-family="'Inter', sans-serif" font-weight="700" font-size="8.5" fill="#00D4FF" text-anchor="middle">128 BPM</text>

  <text x="160" y="278" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">Smart Watches &amp; Fitness Bands</text>
  <text x="160" y="295" font-family="'Inter', sans-serif" font-weight="500" font-size="10" fill="#FFD400" text-anchor="middle">BT Calling • AMOLED • Waterproof</text>
</svg>
