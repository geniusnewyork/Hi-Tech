<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="opBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19232D" />
      <stop offset="100%" stop-color="#0F141A" />
    </linearGradient>
    <linearGradient id="opGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD400" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>
  <!-- Device Chassis -->
  <rect x="72" y="40" width="176" height="320" rx="32" fill="url(#opBody)" stroke="url(#opGold)" stroke-width="2.5" />
  
  <!-- Circular Camera Dial (OnePlus Signature Deco) -->
  <circle cx="160" cy="120" r="48" fill="#151921" stroke="url(#opGold)" stroke-width="2" />
  <circle cx="160" cy="120" r="44" fill="#0C0F14" stroke="#2D3748" stroke-width="1.2" />

  <!-- 3 Inner Lens Elements + Flash in cross layout -->
  <circle cx="144" cy="106" r="11" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
  <circle cx="144" cy="106" r="4" fill="#00D4FF" />

  <circle cx="176" cy="106" r="11" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
  <circle cx="176" cy="106" r="4" fill="#00D4FF" />

  <circle cx="144" cy="134" r="11" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
  <circle cx="144" cy="134" r="4" fill="#00D4FF" />

  <circle cx="176" cy="134" r="7" fill="#FFEAA7" />

  <text x="160" y="240" font-family="'Inter', sans-serif" font-weight="900" font-size="16" fill="#EF4444" text-anchor="middle">1+</text>
  <text x="160" y="260" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" letter-spacing="2" text-anchor="middle">ONEPLUS</text>

  <rect x="95" y="295" width="130" height="26" rx="13" fill="#111827" stroke="rgba(255,212,0,0.3)" />
  <text x="160" y="312" font-family="'Inter', sans-serif" font-weight="700" font-size="10.5" fill="#FFD400" text-anchor="middle">Fast &amp; Smooth 5G</text>
</svg>
