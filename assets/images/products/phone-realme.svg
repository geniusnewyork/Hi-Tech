<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="rmBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261E14" />
      <stop offset="100%" stop-color="#140E0A" />
    </linearGradient>
    <linearGradient id="rmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD400" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
  <rect x="74" y="40" width="172" height="320" rx="30" fill="url(#rmBody)" stroke="url(#rmGold)" stroke-width="2.5" />
  
  <!-- Luxury Watch Inspired Camera Fluted Bezel (Realme 12 Pro style) -->
  <circle cx="160" cy="115" r="46" fill="#1A140F" stroke="url(#rmGold)" stroke-width="3" stroke-dasharray="2 3" />
  <circle cx="160" cy="115" r="40" fill="#0C0805" />
  
  <!-- 4 lenses in luxury dial -->
  <circle cx="146" cy="103" r="10" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
  <circle cx="174" cy="103" r="10" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
  <circle cx="160" cy="128" r="11" fill="#1E293B" stroke="url(#rmGold)" stroke-width="1.5" />

  <!-- Center Gold seam zipper line down the phone -->
  <line x1="160" y1="165" x2="160" y2="350" stroke="url(#rmGold)" stroke-width="2" stroke-dasharray="3 2" />

  <text x="160" y="240" font-family="'Inter', sans-serif" font-weight="900" font-size="16" fill="#FFD400" letter-spacing="1" text-anchor="middle">realme</text>

  <rect x="95" y="295" width="130" height="26" rx="13" fill="#111827" stroke="rgba(255,212,0,0.3)" />
  <text x="160" y="312" font-family="'Inter', sans-serif" font-weight="700" font-size="10.5" fill="#FFD400" text-anchor="middle">Periscope Portrait</text>
</svg>
