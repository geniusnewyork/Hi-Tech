<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="appleBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2D30" />
      <stop offset="50%" stop-color="#1E1E20" />
      <stop offset="100%" stop-color="#141416" />
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFD400" />
      <stop offset="100%" stop-color="#C69200" />
    </linearGradient>
    <radialGradient id="lensGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#223344" />
      <stop offset="70%" stop-color="#0A0F14" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
  </defs>
  <!-- Background Glow -->
  <circle cx="160" cy="200" r="140" fill="#FFD400" fill-opacity="0.05" />

  <!-- Device Back Plate -->
  <rect x="70" y="40" width="180" height="320" rx="36" fill="url(#appleBody)" stroke="url(#goldRim)" stroke-width="2.5" />
  
  <!-- Camera Island Plateau -->
  <rect x="85" y="55" width="84" height="84" rx="22" fill="#242426" stroke="rgba(255,212,0,0.3)" stroke-width="1.5" />
  
  <!-- 3 Big Pro Lenses -->
  <circle cx="106" cy="76" r="14" fill="url(#lensGrad)" stroke="#3E3E42" stroke-width="2" />
  <circle cx="106" cy="76" r="6" fill="#0C1B2A" />
  <circle cx="104" cy="74" r="2" fill="#00D4FF" opacity="0.8" />

  <circle cx="106" cy="118" r="14" fill="url(#lensGrad)" stroke="#3E3E42" stroke-width="2" />
  <circle cx="106" cy="118" r="6" fill="#0C1B2A" />
  <circle cx="104" cy="116" r="2" fill="#00D4FF" opacity="0.8" />

  <circle cx="148" cy="97" r="14" fill="url(#lensGrad)" stroke="#3E3E42" stroke-width="2" />
  <circle cx="148" cy="97" r="6" fill="#0C1B2A" />
  <circle cx="146" cy="95" r="2" fill="#00D4FF" opacity="0.8" />

  <!-- Flash & LiDAR -->
  <circle cx="148" cy="68" r="4.5" fill="#FFEAA7" />
  <circle cx="148" cy="126" r="4" fill="#111111" />

  <!-- Apple Brand / Hub Emblem -->
  <path d="M160 210 C154 210 148 215 148 223 C148 233 156 244 160 244 C164 244 172 233 172 223 C172 215 166 210 160 210 Z" fill="#FFD400" fill-opacity="0.85" />
  <path d="M162 205 C164 203 165 200 164 197 C161 198 158 200 159 203 C160 205 162 205 162 205 Z" fill="#FFD400" />

  <!-- Model Badge -->
  <rect x="95" y="295" width="130" height="26" rx="13" fill="#18181B" stroke="rgba(255,255,255,0.12)" />
  <text x="160" y="312" font-family="'Inter', sans-serif" font-weight="700" font-size="10.5" fill="#FFFFFF" text-anchor="middle">Apple iPhone Series</text>
</svg>
