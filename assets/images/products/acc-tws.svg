<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="twsGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD400" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="twsBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24272E" />
      <stop offset="100%" stop-color="#121316" />
    </linearGradient>
  </defs>
  <circle cx="160" cy="160" r="140" fill="url(#twsGlow)" />
  <!-- Charging Case Open -->
  <rect x="80" y="110" width="160" height="120" rx="40" fill="url(#twsBody)" stroke="#FFD400" stroke-width="2" />
  <line x1="80" y1="145" x2="240" y2="145" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
  
  <!-- LED battery indicator on case -->
  <circle cx="160" cy="180" r="3" fill="#10B981" />
  <circle cx="150" cy="180" r="3" fill="#10B981" />
  <circle cx="170" cy="180" r="3" fill="#10B981" />

  <!-- Earbud Left -->
  <g transform="translate(100, 75)">
    <circle cx="18" cy="18" r="14" fill="#1E2024" stroke="#FFD400" stroke-width="1.5" />
    <rect x="14" y="24" width="8" height="34" rx="4" fill="#1E2024" stroke="#FFD400" stroke-width="1.2" />
    <circle cx="18" cy="18" r="6" fill="#00D4FF" />
  </g>

  <!-- Earbud Right -->
  <g transform="translate(180, 75)">
    <circle cx="18" cy="18" r="14" fill="#1E2024" stroke="#FFD400" stroke-width="1.5" />
    <rect x="14" y="24" width="8" height="34" rx="4" fill="#1E2024" stroke="#FFD400" stroke-width="1.2" />
    <circle cx="18" cy="18" r="6" fill="#00D4FF" />
  </g>

  <text x="160" y="260" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">True Wireless Earbuds (TWS)</text>
  <text x="160" y="278" font-family="'Inter', sans-serif" font-weight="500" font-size="10" fill="#FFD400" text-anchor="middle">ANC • Deep Bass • Long Battery</text>
</svg>
