<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="pbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD400" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="pbMat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2E36" />
      <stop offset="100%" stop-color="#121317" />
    </linearGradient>
  </defs>
  <circle cx="160" cy="160" r="140" fill="url(#pbGlow)" />
  <!-- Heavy Duty Power Bank Block -->
  <rect x="90" y="60" width="140" height="200" rx="16" fill="url(#pbMat)" stroke="#FFD400" stroke-width="2.5" />
  
  <!-- Digital LED Display Window -->
  <rect x="125" y="85" width="70" height="34" rx="8" fill="#090A0D" stroke="#333333" stroke-width="1.5" />
  <text x="160" y="108" font-family="'Inter', monospace, sans-serif" font-weight="900" font-size="16" fill="#10B981" text-anchor="middle">100<tspan font-size="10">%</tspan></text>

  <!-- Output Ports at Top Edge -->
  <rect x="108" y="55" width="22" height="5" rx="2" fill="#D4D4D8" />
  <rect x="148" y="55" width="24" height="5" rx="2" fill="#FFD400" />
  <rect x="190" y="55" width="22" height="5" rx="2" fill="#D4D4D8" />

  <!-- Capacity Imprint -->
  <text x="160" y="160" font-family="'Inter', sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">20000 mAh</text>
  <text x="160" y="180" font-family="'Inter', sans-serif" font-weight="600" font-size="9.5" fill="#FFD400" text-anchor="middle">22.5W FAST CHARGE / QC</text>

  <text x="160" y="278" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">High-Capacity Power Banks</text>
  <text x="160" y="295" font-family="'Inter', sans-serif" font-weight="500" font-size="10" fill="#FFD400" text-anchor="middle">10,000mAh &amp; 20,000mAh Fast Delivery</text>
</svg>
