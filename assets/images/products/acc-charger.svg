  <text x="160" y="255" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">Fast Adapters &amp; Chargers</text>
  <text x="160" y="274" font-family="'Inter', sans-serif" font-weight="500" font-size="10" fill="#FFD400" text-anchor="middle">Type-C, iPhone &amp; Universal Brands</text>
</svg>
