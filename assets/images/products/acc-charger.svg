      <stop offset="0%" stop-color="#FFD400" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="chgBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3039" />
      <stop offset="100%" stop-color="#14161C" />
    </linearGradient>
  </defs>
  <circle cx="160" cy="160" r="140" fill="url(#chgGlow)" />
  <!-- Fast Charging Adapter Block -->
  <rect x="100" y="80" width="120" height="130" rx="20" fill="url(#chgBody)" stroke="#FFD400" stroke-width="2.5" />
  
  <!-- Plug Pins Top -->
  <rect x="122" y="54" width="14" height="30" rx="3" fill="#D4D4D8" />
  <rect x="184" y="54" width="14" height="30" rx="3" fill="#D4D4D8" />

  <!-- Lightning Bolt Icon in Center -->
  <polygon points="163,115 150,140 160,140 155,168 174,136 163,136" fill="#FFD400" />
  <text x="160" y="186" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle">65W / 80W / 120W</text>
  <text x="160" y="198" font-family="'Inter', sans-serif" font-weight="600" font-size="8.5" fill="#00D4FF" text-anchor="middle">GaN SUPERVOOC / PD</text>

  <!-- Output Port -->
