<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="gMobBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="100%" stop-color="#0A0A0C" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#gMobBg)" />
  <!-- Display Plinths -->
  <rect x="50" y="80" width="500" height="240" rx="20" fill="#18181B" stroke="rgba(255,212,0,0.2)" stroke-width="2" />
  
  <text x="300" y="125" font-family="'Inter', sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle">NEW SMARTPHONE ARRIVALS</text>
  <text x="300" y="148" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#FFD400" text-anchor="middle">Available In-Store for Hands-on Experience</text>

  <!-- 3 Flagship pedestals -->
  <g transform="translate(100, 170)">
    <rect x="0" y="40" width="100" height="80" rx="8" fill="#0C0D10" stroke="#333333" />
    <rect x="25" y="0" width="50" height="80" rx="10" fill="#222" stroke="#FFD400" stroke-width="2" />
    <text x="50" y="105" font-family="'Inter', sans-serif" font-size="10" fill="#FFF" text-anchor="middle">Apple</text>
  </g>

  <g transform="translate(250, 160)">
    <rect x="0" y="50" width="100" height="80" rx="8" fill="#0C0D10" stroke="#FFD400" stroke-width="1.5" />
    <rect x="25" y="0" width="50" height="88" rx="10" fill="#222" stroke="#00D4FF" stroke-width="2" />
    <text x="50" y="115" font-family="'Inter', sans-serif" font-size="10" fill="#FFD400" text-anchor="middle">Samsung</text>
  </g>

  <g transform="translate(400, 170)">
    <rect x="0" y="40" width="100" height="80" rx="8" fill="#0C0D10" stroke="#333333" />
    <rect x="25" y="0" width="50" height="80" rx="10" fill="#222" stroke="#EF4444" stroke-width="2" />
    <text x="50" y="105" font-family="'Inter', sans-serif" font-size="10" fill="#FFF" text-anchor="middle">OnePlus</text>
  </g>

  <rect x="190" y="340" width="220" height="30" rx="15" fill="#0A0A0C" stroke="#00D4FF" stroke-width="1" />
  <text x="300" y="359" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#00D4FF" text-anchor="middle">Multi-Brand Smartphone Display</text>
</svg>
