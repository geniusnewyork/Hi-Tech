<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="50%" stop-color="#FFD400" />
      <stop offset="100%" stop-color="#E5A800" />
    </linearGradient>
    <filter id="softGlowIcon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background rounded square -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="#0D0D0D" stroke="#222222" stroke-width="2" />

  <!-- Smartphone Outer Shell -->
  <rect x="28" y="16" width="64" height="88" rx="14" fill="#171717" stroke="url(#goldGradIcon)" stroke-width="3.5" />
  <!-- Screen -->
  <rect x="35" y="24" width="50" height="72" rx="8" fill="#050505" />
  <!-- Notch -->
  <rect x="51" y="27" width="18" height="3.5" rx="1.75" fill="#333333" />
  
  <!-- H letter in glowing gold/white -->
  <path d="M47 46 L47 66 M65 46 L65 66 M47 56 L65 56" stroke="url(#goldGradIcon)" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- Circuit Accent dots -->
  <circle cx="56" cy="40" r="2.5" fill="#00D4FF" />
  <circle cx="56" cy="73" r="2.5" fill="#FFD400" />

  <!-- Home line -->
  <rect x="50" y="87" width="20" height="2.5" rx="1.25" fill="#737373" />
  
  <!-- Sparkle -->
  <polygon points="90,16 93,23 100,26 93,29 90,36 87,29 80,26 87,23" fill="url(#goldGradIcon)" filter="url(#softGlowIcon)" />
</svg>
