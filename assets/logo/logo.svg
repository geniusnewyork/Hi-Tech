<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="50%" stop-color="#FFD400" />
      <stop offset="100%" stop-color="#E5A800" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD400" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0.8" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Device Icon Frame -->
  <g transform="translate(10, 10)">
    <!-- Smartphone Outer Shell -->
    <rect x="10" y="5" width="65" height="90" rx="14" fill="#121212" stroke="url(#goldGrad)" stroke-width="3.5" />
    <!-- Screen -->
    <rect x="17" y="14" width="51" height="72" rx="7" fill="#050505" />
    <!-- Dynamic Island / Notch -->
    <rect x="33" y="18" width="19" height="4" rx="2" fill="#262626" />
    <!-- Gold Circuit Tech Nodes inside screen -->
    <path d="M26 35 L42 35 L48 45 L60 45" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85" />
    <circle cx="26" cy="35" r="2.5" fill="#FFD400" />
    <circle cx="60" cy="45" r="2.5" fill="#FFD400" />
    <!-- Tech Pulse Spark / Letter H -->
    <path d="M30 65 L30 50 M44 65 L44 50 M30 57.5 L44 57.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <!-- Bottom Home Indicator -->
    <rect x="34" y="78" width="17" height="2" rx="1" fill="#737373" />
    <!-- Top Right Sparkle -->
    <polygon points="76,8 79,15 86,18 79,21 76,28 73,21 66,18 73,15" fill="url(#goldGrad)" filter="url(#softGlow)" />
  </g>

  <!-- Brand Typography -->
  <!-- "HI-TECH" in bold high-impact modern font -->
  <text x="110" y="60" font-family="'Inter', 'Poppins', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="1.5">
    HI<tspan fill="url(#goldGrad)">-</tspan>TECH
  </text>
  
  <!-- "MOBILE HUB" sub-headline -->
  <text x="112" y="88" font-family="'Inter', 'Poppins', 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="18" fill="url(#goldGrad)" letter-spacing="6">
    MOBILE HUB
  </text>

  <!-- Location Tag & Accent Line -->
  <line x1="335" y1="46" x2="335" y2="88" stroke="#333333" stroke-width="1.5" />
  <g transform="translate(350, 48)">
    <circle cx="6" cy="8" r="4" fill="#FFD400" />
    <text x="16" y="12" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#E5E5E5" letter-spacing="1">
      HANSI, HARYANA
    </text>
    <text x="16" y="30" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="500" font-size="11" fill="#A3A3A3" letter-spacing="0.5">
      Mobiles • Repair • Accessories
    </text>
  </g>
</svg>
